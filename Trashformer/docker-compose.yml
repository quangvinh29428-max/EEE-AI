version: '3.8'

services:
  backend:
    build: ./backend
    container_name: trashformer_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - AI_ENGINE_MODE=demo
      - DATABASE_URL=sqlite:///./database/trashformer.db
    volumes:
      - ./backend/database:/app/database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trashformer_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

